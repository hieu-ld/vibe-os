# Bản nháp chưa lưu của Kate (user-setup bước 0j cất ở đây) — dọn bản
# không đổi trong 30 ngày (user 2026-10-12). Kate tự xoá bản nháp khi lưu,
# đóng file hay bấm Recover/Discard; chỉ sót lại khi Kate bị tắt đột ngột mà
# file không được mở lại. Chạy bởi systemd-tmpfiles-clean.timer của phiên
# người dùng (bật sẵn trong image nền). "e": chỉ dọn, không tạo thư mục.
# %S = ~/.local/state (XDG_STATE_HOME). "m:" = chỉ xét lần sửa cuối (Kate ghi
# lại bản nháp mỗi lần gõ); mặc định còn xét cả ngày tạo + ngày đọc.
e %S/kate/swap - - - m:30d
