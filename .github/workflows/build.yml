name: build

on:
  schedule:
    # 06:00 UTC (13:00 giờ Việt Nam) — sau khi Universal Blue build xong image
    # nền. Hằng ngày để bản vá bảo mật vào trong ngày (repo public: phút
    # Actions không giới hạn).
    - cron: "00 06 * * *"
  # Chỉ main: không có dòng này thì mỗi PR (kể cả của Dependabot) chạy HAI lần
  # — một cho push lên nhánh, một cho pull_request — tốn gấp đôi phút Actions.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:   # cho phép bấm tay "Run workflow" trên GitHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Sửa theme/palette.toml mà quên chạy tools/gen-theme.py thì dừng ở đây, trước
  # khi tốn thời gian build image mang màu cũ. Cũng kiểm lại mọi mức tương phản.
  theme:
    name: Check theme colors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tools/gen-theme.py --check --report
      - run: python3 tools/build-wallpaper.py --check
      - run: python3 tools/build-cursors.py --check
      - run: python3 tools/build-icons.py --check
      - run: python3 tools/build-mime-icons.py --check
      - run: python3 tools/build-app-icons.py --check
      - run: python3 tools/build-folder-icons.py --check
      # Âm lịch của đồng hồ thanh trên (Node có sẵn trên ubuntu-latest).
      - run: node tools/test-lunar.js

  bluebuild:
    name: Build ${{ matrix.recipe }}
    needs: theme
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false   # bản NVIDIA lỗi thì bản thường vẫn build tiếp, và ngược lại
      matrix:
        recipe:
          - samhie.yml
          - samhie-nvidia.yml
    steps:
      - name: Build image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          # PR chỉ build để kiểm recipe, không đẩy lên ghcr và không ký. PR của
          # Dependabot không đọc được secret nên SIGNING_SECRET rỗng; bluebuild
          # chỉ đòi khoá khi đẩy (đo 2026-09-30: build.rs `if self.push && !no_sign`).
          push: ${{ github.event_name != 'pull_request' }}
          maximize_build_space: true
