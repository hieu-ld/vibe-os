# Bảng màu Samhie — NGUỒN MÀU DUY NHẤT.
#
# Mọi mã màu của Samhie nằm ở đây, và CHỈ ở đây. Cấu hình của từng app
# (Hyprland, Quickshell, Kvantum, kdeglobals, Konsole) được
# SINH ra từ file này bằng:
#
#     python3 tools/gen-theme.py          # sinh lại mọi file
#     python3 tools/gen-theme.py --check  # chỉ kiểm, không ghi (CI dùng)
#
# Đừng sửa tay file sinh ra — đầu mỗi file có dòng "SINH TỰ ĐỘNG".
#
# Mã màu lấy từ Samhie 1.0 (~/Projects/Distro, SamhieDark/SamhieLight.colors),
# đã đo tương phản và user đã duyệt tận mắt ở đó. Tên vai trò bám bộ biến màu
# trong Figma của user (Black, Card, Secondary, Sub Secondary...).
#
# CÁCH DÙNG MÀU — tinh thần "tone lạnh, tiết chế":
#   ~90%  xám trung tính: mọi bề mặt, chữ, viền.
#   ~8%   cyan/màu lạnh: CHỈ cho thứ đang được chọn / đang focus / đang chạy
#         (viền cửa sổ focus, vạch active trên dock, vùng chọn, nút chính,
#         dấu nhắc Konsole). Không dùng cyan làm nền lớn hay để trang trí.
#   ~2%   màu ấm (warm): điểm nhấn hiếm — thứ cần mắt chú ý (cảnh báo, huy hiệu
#         thông báo, đang ghi âm/ghi hình). Hiếm mới có giá trị tương phản.
# Thêm vai trò mới thì hỏi trước: nó thuộc nhóm nào trong ba nhóm trên?

# Giống nhau ở cả chế độ tối lẫn sáng.
[shared]
black = "#0a0a0a"   # Figma: Black
white = "#fafafa"   # Figma: White
cyan  = "#00c0e8"   # Figma: Cyan — màu nhấn gốc. Trên nền SÁNG chỉ dùng làm
                    # nền (chữ đen đè lên), vì làm chữ thì chỉ đạt 2,2:1.
# Con trỏ chuột (user vẽ 2026-09-29, theme/cursors/). MỘT bộ cho cả tối lẫn
# sáng — như Adwaita/Breeze/Windows: viền trắng thấy được trên mọi nền (user
# chốt). Dấu đỏ (help, not-allowed) dùng dark.danger, không thêm vai trò riêng.
cursor         = "#003845"
cursor-outline = "#fafafa"
# Chụp màn hình (user chốt 2026-09-29): khung ảnh xem trước + khung vùng chọn
# TRẮNG, lớp phủ tối ngoài vùng chọn (QML đặt độ mờ). Giống nhau cả tối lẫn
# sáng vì chúng nằm đè lên ẢNH CHỤP, không phải lên giao diện Samhie.
capture-frame = "#fafafa"
capture-shade = "#0a0a0a"

[dark]
# Thang bề mặt 4 bậc — user chốt 2026-09-13 bằng ảnh chụp Dolphin (bản 1.0):
bar           = "#0a0a0a"  # thanh trên, dock                (Figma: Black)
bar-text      = "#e8e8e8"  # chữ/icon trên thanh — tách riêng vì thanh luôn tối
bar-accent    = "#00c0e8"  # vạch active, icon đang bật trên thanh
card          = "#171717"  # vùng nội dung, popup, tooltip   (Figma: Card)
card-alt      = "#171717"  # hàng xen kẽ trong danh sách — bản tối cố ý KHÔNG kẻ sọc
secondary     = "#262626"  # khung cửa sổ, sidebar, thanh tab (Figma: Secondary)
sub-secondary = "#3b3c3c"  # viền, mặt nút                   (Figma: Sub Secondary)

text       = "#e8e8e8"
text-muted = "#8f8f8f"     # chữ phụ, chữ bị vô hiệu hoá

accent      = "#00c0e8"    # viền focus, vạch active, icon đang bật
accent-text = "#00c0e8"    # cyan dùng làm CHỮ (link đang focus, dấu nhắc)
on-accent   = "#0a0a0a"    # chữ đặt trên nền accent
selection   = "#006a80"    # nền vùng chọn
selection-alt = "#005365"  # nền chọn phụ (hàng xen kẽ đang chọn)
on-selection = "#f6f6f6"   # chữ trong vùng chọn
on-selection-muted = "#dcdcdc"  # bản 1.0 #cdcdcd chỉ 3,92:1 -> sáng lên cho đạt 4,54

link    = "#5dc5d6"
visited = "#a082c8"

danger  = "#e26767"        # lỗi, xoá, sai mật khẩu. Bản 1.0 là #e05e5e: chỉ đạt
                           # 4,27:1 trên Secondary; sáng lên 1% là đạt 4,59:1
                           # (user chốt 2026-09-28)
warning = "#e8a048"        # cảnh báo — cũng là màu ấm chính
success = "#54c48c"
warm    = "#e8a048"        # điểm nhấn ấm (xem "CÁCH DÙNG MÀU" ở trên)

[light]
# Bản sáng giữ thanh trên + dock TỐI như bản 1.0 — TẠM. User muốn thanh + dock
# bản sáng cũng SÁNG (2026-09-28); đổi bar/bar-text/bar-accent ở giai đoạn 3,
# cùng lúc dựng thanh Quickshell và xem lại bộ icon nét sáng.
bar           = "#1a1a1a"
bar-text      = "#e8e8e8"  # KHÔNG phải `text` của bản sáng: #1c1c1c trên #1a1a1a
bar-accent    = "#00c0e8"  # là chữ biến mất mà không lỗi nào báo (bản 1.0 suýt dính)
card          = "#fafafa"
card-alt      = "#f4f4f4"
secondary     = "#ededed"
sub-secondary = "#d0d0d0"

text       = "#1c1c1c"
text-muted = "#6b6b6b"

accent      = "#0d728f"    # cyan đậm — bản sáng cần sắc đậm mới đọc được
accent-text = "#0d728f"
on-accent   = "#fafafa"
selection   = "#0d728f"
selection-alt = "#0a5c73"
on-selection = "#fafafa"   # chữ trong vùng chọn TRẮNG — `text` (#1c1c1c) chỉ đạt 3,10:1
on-selection-muted = "#e9e9e9"  # bản 1.0 #e1e1e1 chỉ 4,20:1 -> 4,53

link    = "#0d728f"
visited = "#6a4c93"

danger  = "#b3261e"
warning = "#8f5a00"
success = "#1b7a45"
warm    = "#8f5a00"

# Font giao diện — user chốt 2026-09-28 (thử trong máy ảo): Dongle Light 20.
# Dongle rất "lùn" (chữ x thấp) nên cỡ số lớn; Hack 11 cao ngang Dongle 20
# (đo bằng cách vẽ chữ: H cao 11,0px cả hai). File Dongle nằm ở
# files/system/usr/share/fonts/dongle (Fedora không có gói; giấy phép OFL).
[fonts]
ui        = "Dongle"
ui-weight = 300           # Light. 350 không có (xem README của font)
size      = 20
mono      = "Hack"        # terminal, code — Dongle không phải font đều nét
mono-size = 11

# Thông số riêng của KDE (kdeglobals), theo từng chế độ.
[kde]
# Màu viền cửa sổ/vạch ngăn = pha(nền cửa sổ, màu chữ, frame-contrast) — Breeze
# tự tính, không có khoá viền riêng. Bản 1.0 đo: tối 0.1 -> #393939 (user chọn
# 2026-09-13), sáng 0.14.
frame-contrast = { dark = 0.1, light = 0.14 }
# Bộ icon Samhie (files/system/usr/share/icons/Samhie) chỉ chứa icon thay riêng,
# còn lại kế thừa breeze-dark. Bản sáng tạm để Breeze: Samhie kế thừa
# breeze-dark (icon nhiều màu vẽ cho nền tối) — xem lại khi làm bản sáng.
icon-theme     = { dark = "Samhie", light = "breeze" }

# 16 màu ANSI của Konsole (bản 1.0, theme/konsole/Samhie.colorscheme).
# Thứ tự: đen, đỏ, lục, vàng, lam, tím, cyan, trắng — thường / sáng (intense).
# Sinh ra /usr/share/konsole/Samhie.colorscheme. Dấu nhắc lệnh ($) dùng màu số
# 6 (cyan) — files/system/etc/profile.d/samhie-prompt.sh.
[terminal]
background = "#171717"     # = dark.card: vùng dấu nhắc là Card (user chốt)
background-intense = "#262626"
foreground = "#e4e4e4"
foreground-faint = "#989898"
foreground-intense = "#f8f8f8"
cursor = "#00c0e8"         # con trỏ khối nhấp nháy, màu nhấn
normal = ["#3b3c3c", "#e05e5e", "#7acc8c", "#e2b262", "#60a0dc", "#b28cd6", "#00c0e8", "#d0d0d0"]
bright = ["#5a5a5a", "#f07c7c", "#96dca5", "#f0c882", "#82b9eb", "#c8a8e6", "#52d6fa", "#f6f6f6"]
# Chữ "mờ" (escape 2, vd gợi ý lệnh mờ của shell) — bản 1.0 tự chọn ~2/3 độ sáng.
faint  = ["#2d2d2d", "#964040", "#528a5f", "#987842", "#406c94", "#785e90", "#00829d", "#8c8c8c"]

# Lời hứa tương phản — gen-theme.py đo lại mỗi lần chạy, hụt là BÁO LỖI.
# Chuẩn WCAG: 4,5:1 cho chữ thường, 3:1 cho thành phần giao diện (viền, icon).
# Cặp nào cố ý thấp hơn thì ghi lý do ngay dưới.
[[contrast]]
fg = ["text", "text-muted", "accent-text", "danger", "warning", "success", "link"]
bg = ["card", "secondary"]
min = 4.5

[[contrast]]
fg = ["text"]
bg = ["sub-secondary"]
min = 4.5

[[contrast]]
fg = ["on-selection"]
bg = ["selection", "selection-alt"]
min = 4.5

[[contrast]]
# Chữ phụ trong vùng chọn (vd cột ngày sửa của file đang chọn).
fg = ["on-selection-muted"]
bg = ["selection"]
min = 4.5

[[contrast]]
fg = ["bar-text"]
bg = ["bar"]
min = 4.5

[[contrast]]
fg = ["bar-accent"]
bg = ["bar"]
min = 3.0

[[contrast]]
fg = ["on-accent"]
bg = ["accent"]
min = 4.5

[[contrast]]
# Viền focus/vạch active nằm trên mọi bề mặt — chỉ cần mức "thành phần giao diện".
# Không đòi trên sub-secondary: bản sáng chỉ đạt 3,56 cho accent trên mặt nút,
# user đã chấp nhận ở bản 1.0 (mặt nút thì cyan là viền/icon, đạt 3:1).
fg = ["accent"]
bg = ["card", "secondary", "sub-secondary"]
min = 3.0
