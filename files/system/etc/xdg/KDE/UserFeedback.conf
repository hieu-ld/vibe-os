# Samhie: tắt KUserFeedback (gửi số liệu dùng máy về KDE) cho mọi app KDE —
# công tắc tổng mà Provider::isEnabled() đọc (QSettings "KDE"/"UserFeedback",
# kf6-kuserfeedback 6.30). Tắt rồi thì Dolphin cũng không có trang "User
# Feedback" trong Configure Dolphin. Người dùng muốn gửi thì ghi
# Enabled=true vào ~/.config/KDE/UserFeedback.conf.
[UserFeedback]
Enabled=false
