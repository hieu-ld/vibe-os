# Bảng màu Samhie — NGUỒN MÀU DUY NHẤT.
#
# Mọi mã màu của Samhie nằm ở đây, và CHỈ ở đây. Cấu hình của từng app
# (Hyprland, Quickshell, Kvantum, kdeglobals, Konsole) được
# SINH ra từ file này bằng:
#
#     python3 tools/gen-theme.py          # sinh lại mọi file
#     python3 tools/gen-theme.py --check  # chỉ kiểm, không ghi (CI dùng)
#
# Đừng sửa tay file sinh ra — đầu mỗi file có dòng "SINH TỰ ĐỘNG".
#
# Mã màu lấy từ Samhie 1.0 (~/Storage/Archive/Distro, SamhieDark/SamhieLight.colors),
# đã đo tương phản và user đã duyệt tận mắt ở đó. Tên vai trò bám bộ biến màu
# trong Figma của user (Black, Card, Secondary, Sub Secondary...).
#
# CÁCH DÙNG MÀU — tinh thần "tone lạnh, tiết chế":
#   ~90%  xám trung tính: mọi bề mặt, chữ, viền.
#   ~8%   cyan/màu lạnh: CHỈ cho thứ đang được chọn / đang focus / đang chạy
#         (viền cửa sổ focus, vạch active trên dock, vùng chọn, nút chính,
#         dấu nhắc Konsole). Không dùng cyan làm nền lớn hay để trang trí.
#   ~2%   màu ấm (warm): điểm nhấn hiếm — thứ cần mắt chú ý (cảnh báo, huy hiệu
#         thông báo, đang ghi âm/ghi hình). Hiếm mới có giá trị tương phản.
# Thêm vai trò mới thì hỏi trước: nó thuộc nhóm nào trong ba nhóm trên?

# Giống nhau ở cả chế độ tối lẫn sáng.
[shared]
black = "#0a0a0a"   # Figma: Black
white = "#fafafa"   # Figma: White
cyan  = "#00c0e8"   # Figma: Cyan — màu nhấn gốc. Trên nền SÁNG chỉ dùng làm
                    # nền (chữ đen đè lên), vì làm chữ thì chỉ đạt 2,2:1.
# Con trỏ chuột (user vẽ 2026-09-29, theme/cursors/). MỘT bộ cho cả tối lẫn
# sáng — như Adwaita/Breeze/Windows: viền trắng thấy được trên mọi nền (user
# chốt). Dấu đỏ (help, not-allowed) dùng dark.danger, không thêm vai trò riêng.
cursor         = "#003845"
cursor-outline = "#fafafa"
# Chụp màn hình (user chốt 2026-09-29): khung ảnh xem trước + khung vùng chọn
# TRẮNG, lớp phủ tối ngoài vùng chọn (QML đặt độ mờ). Giống nhau cả tối lẫn
# sáng vì chúng nằm đè lên ẢNH CHỤP, không phải lên giao diện Samhie.
capture-frame = "#fafafa"
capture-shade = "#0a0a0a"

[dark]
# Thang bề mặt 4 bậc — user chốt 2026-09-13 bằng ảnh chụp Dolphin (bản 1.0):
bar           = "#0a0a0a"  # thanh trên, dock                (Figma: Black)
bar-text      = "#e8e8e8"  # chữ/icon trên thanh — tách riêng vì thanh luôn tối
bar-accent    = "#00c0e8"  # vạch active, icon đang bật trên thanh
bar-badge     = "#790000"  # chấm "có thông báo" trên chuông (user vẽ 2026-10-06)
card          = "#171717"  # vùng nội dung, popup, tooltip   (Figma: Card)
card-alt      = "#171717"  # hàng xen kẽ trong danh sách — bản tối cố ý KHÔNG kẻ sọc
secondary     = "#262626"  # khung cửa sổ, sidebar, thanh tab (Figma: Secondary)
sub-secondary = "#393939"  # viền, mặt nút. Figma: Sub Secondary #3b3c3c; user đổi 2026-10-04
                           # thành #393939 (viền cửa sổ bản 1.0) cho MỌI viền trong distro
window-border = "#363636"  # viền cửa sổ (Hyprland), đang dùng = không dùng. MUỐN thấy #393939
                           # = sub-secondary, như bản 1.0 (KDE frameContrast 0.1) — user 2026-10-04
                           # chọn màu này cho mọi viền. Khai #363636 vì Hyprland (render:cm_enabled)
                           # vẽ màu viền lệch: 393939→3c3c3c, 363636→393939, 808080→7f7f7f (đo
                           # container); mặt app/dock thì KHÔNG lệch (thanh trên đúng #0a0a0a).
hover         = "#262626"  # nền ô đang trỏ chuột TRÊN NỀN CARD: dòng menu, ô file Dolphin,
                           # tiêu đề cột, dòng popup Quickshell — = secondary, như popup nút
                           # nguồn (user 2026-10-05: mọi app một màu hover; trước là #363d3f
                           # xám pha cyan, user vẽ 2026-10-03). Trên nền secondary (thanh
                           # công cụ, dải tab) hover nâng một bậc = sub-secondary.
item-selected-border = "#097389"  # viền ô file đang chọn (Dolphin, cả Icons lẫn Details) —
                                 # user 2026-10-05: cyan accent chói → tối lại, hợp tông
                                 # thư mục + hover: = thân thư mục mặc định ([folders] default)
scrollbar         = "#5f5f5f"  # thanh cuộn (tự ẩn) — user 2026-10-05: ĐỤC, cùng độ sáng
                               # như bản cũ (text-muted 60% trên card = #5f5f5f)
scrollbar-hover   = "#6a6a6a"  # đang trỏ chuột
scrollbar-pressed = "#767676"  # đang kéo: "sáng hơn 1 chút thôi" (trước là text, chói)

text       = "#bdbec1"     # user đổi 2026-10-03 (bản vẽ Konsole/Dolphin): dịu mắt khi nhìn lâu.
                           # 8,1:1 trên secondary, 6,2:1 trên sub-secondary
text-muted = "#8f8f8f"     # chữ phụ, chữ bị vô hiệu hoá

accent      = "#00c0e8"    # viền focus, vạch active, icon đang bật
accent-text = "#00c0e8"    # cyan dùng làm CHỮ (link đang focus, dấu nhắc)
on-accent   = "#0a0a0a"    # chữ đặt trên nền accent
selection   = "#006a80"    # nền vùng chọn
selection-alt = "#005365"  # nền chọn phụ (hàng xen kẽ đang chọn)
on-selection = "#f6f6f6"   # chữ trong vùng chọn
on-selection-muted = "#dcdcdc"  # bản 1.0 #cdcdcd chỉ 3,92:1 -> sáng lên cho đạt 4,54

link    = "#5dc5d6"
visited = "#a082c8"

danger  = "#e26767"        # lỗi, xoá, sai mật khẩu. Bản 1.0 là #e05e5e: chỉ đạt
                           # 4,27:1 trên Secondary; sáng lên 1% là đạt 4,59:1
                           # (user chốt 2026-09-28)
warning = "#e8a048"        # cảnh báo — cũng là màu ấm chính
success = "#54c48c"
warm    = "#e8a048"        # điểm nhấn ấm (xem "CÁCH DÙNG MÀU" ở trên)

[light]
# Thanh trên + dock bản sáng cũng SÁNG (user muốn 2026-09-28, chốt màu
# 2026-10-02: #f3f3f3 như thanh tác vụ Windows 11 bản sáng — tách nhẹ khỏi
# cửa sổ/popup #fafafa). Thanh vẫn dùng vai trò bar-* riêng: đổi màu thanh
# không kéo theo màu cửa sổ và ngược lại.
bar           = "#f3f3f3"
bar-text      = "#1c1c1c"
bar-accent    = "#0d728f"  # cyan đậm như `accent` bản sáng — #00c0e8 trên nền sáng không đọc được
bar-badge     = "#b3261e"  # = danger bản sáng: #790000 trên nền sáng gần như đen
card          = "#fafafa"
card-alt      = "#f4f4f4"
secondary     = "#ededed"
sub-secondary = "#d0d0d0"
window-border = "#c9c9c9"  # tạm — Hyprland chỉ dùng bản tối (colors.lua); duyệt ở đợt bản sáng
hover         = "#ededed"  # = secondary, như bản tối — duyệt ở đợt bản sáng
item-selected-border = "#0d728f"  # tạm = accent bản sáng
scrollbar         = "#a4a4a4"  # tạm, cùng ý bản tối: text-muted 60% trên card, đậm dần khi trỏ/kéo
scrollbar-hover   = "#989898"
scrollbar-pressed = "#8c8c8c"

text       = "#1c1c1c"
text-muted = "#6b6b6b"

accent      = "#0d728f"    # cyan đậm — bản sáng cần sắc đậm mới đọc được
accent-text = "#0d728f"
on-accent   = "#fafafa"
selection   = "#0d728f"
selection-alt = "#0a5c73"
on-selection = "#fafafa"   # chữ trong vùng chọn TRẮNG — `text` (#1c1c1c) chỉ đạt 3,10:1
on-selection-muted = "#e9e9e9"  # bản 1.0 #e1e1e1 chỉ 4,20:1 -> 4,53

link    = "#0d728f"
visited = "#6a4c93"

danger  = "#b3261e"
warning = "#8f5a00"
success = "#1b7a45"
warm    = "#8f5a00"

# Font giao diện — user chốt 2026-09-28 (thử trong máy ảo): Dongle Light 20.
# Dongle rất "lùn" (chữ x thấp) nên cỡ số lớn; Hack 11 cao ngang Dongle 20
# (đo bằng cách vẽ chữ: H cao 11,0px cả hai). Font code đổi sang Fira Code
# (user 2026-10-20, cả Kate lẫn Konsole; gói fira-code-fonts của Fedora): chữ
# thường 0,540 em ≈ Hack 0,547, chữ hoa 0,706 ≈ 0,729 (OS/2) → giữ cỡ 11. File Dongle nằm ở
# files/system/usr/share/fonts/dongle (Fedora không có gói; giấy phép OFL).
[fonts]
ui        = "Dongle"
ui-weight = 300           # Light. 350 không có (xem README của font)
size      = 20
mono      = "Fira Code"   # terminal, code — Dongle không phải font đều nét
mono-size = 11

# Thông số riêng của KDE (kdeglobals), theo từng chế độ.
[kde]
# Màu viền cửa sổ/vạch ngăn = pha(nền cửa sổ, màu chữ, frame-contrast) — Breeze
# tự tính, không có khoá viền riêng. Bản 1.0 đo: tối 0.1 -> #393939 (user chọn
# 2026-09-13), sáng 0.14.
frame-contrast = { dark = 0.1, light = 0.14 }
# Bộ icon Samhie (files/system/usr/share/icons/Samhie) chỉ chứa icon thay riêng,
# còn lại kế thừa breeze-dark. Bản sáng tạm để Breeze: Samhie kế thừa
# breeze-dark (icon nhiều màu vẽ cho nền tối) — xem lại khi làm bản sáng.
icon-theme     = { dark = "Samhie", light = "breeze" }

# Nền cửa sổ app (Dolphin, Konsole…) — user vẽ 2026-10-03: độ đục 90%, Hyprland
# làm mờ (blur) phần nhìn xuyên qua. Một số dùng chung: Kvantum
# (reduce_window_opacity) và Konsole (Opacity của bảng màu) cùng đọc ở đây.
# Bộ thư mục Dolphin (user vẽ 2026-10-04, tools/build-folder-icons.py).
# Mỗi màu = [thân, nắp, ký hiệu]. Ký hiệu = mũi tên tải, nốt nhạc… trên
# thân. Giống nhau ở cả tối lẫn sáng (như Breeze).
# Đây là màu NỘI DUNG (icon), không phải giao diện — nên mặc định là cyan dù
# "CÁCH DÙNG MÀU" ở trên dành cyan cho thứ đang chọn.
#   default: từ ảnh mẫu user gửi (đo điểm ảnh: thân #0b819a, nắp #076174 —
#            OKLCH thân L 0,558 C 0,098, nắp L × 0,816, C × 0,814). User thấy
#            vẫn chói khi nhìn lâu (2026-10-04) → L và C cả hai × 0,92.
#   Ký hiệu: = màu nắp, như ảnh mẫu (1,56:1 với thân — mờ mờ, user thích
#            vậy). Đã thử bản đậm L × 0,55, C × 0,6 của thân (2,88:1) trong máy
#            ảo 2026-10-04 — user chọn giữ bản mờ. Tách riêng để chỉnh sau.
#            Riêng important: màu đỏ riêng, bảng [folder-symbols] bên dưới.
#   8 màu kia: cùng độ đậm, chỉ đổi sắc (H); vàng/cam sáng hơn chút (L 0,66 /
#            0,60) vì cùng L thì vàng ra màu bùn; nâu L 0,50 C 0,065; xám C 0,012.
# Thanh "màu thư mục" của Dolphin: Default = inode-directory (= default).
# cyan từng trùng default (như Breeze: folder-blue trùng thư mục mặc định) —
# user thấy hai ô giống nhau (2026-10-05) → cyan ngả ngọc lam (H 190, default
# H 218), L 0,565 C 0,095 như các màu kia.
[folders]
default = ["#097389", "#055667", "#055667"]
red     = ["#ac5853", "#82413d", "#82413d"]   # H 25
orange  = ["#b26d3a", "#87512a", "#87512a"]   # H 55
yellow  = ["#ab8f3e", "#826c2e", "#826c2e"]   # H 90
green   = ["#4b8759", "#376642", "#376642"]   # H 150
cyan    = ["#0e8782", "#096662", "#096662"]   # H 190
blue    = ["#4773ab", "#345681", "#345681"]   # H 255
violet  = ["#7b63a3", "#5c4a7b", "#5c4a7b"]   # H 300
brown   = ["#80593f", "#60422e", "#60422e"]   # H 55
grey    = ["#6e767b", "#53585c", "#53585c"]   # H 240

# Ký hiệu thư mục có màu riêng (thay màu [2] của [folders]) — tên ký hiệu
# (theme/icons/hugeicons/symbol-<tên>.svg) → màu, chỉ trên thân thư mục (icon
# menu Symbol một màu theo chữ như mọi icon menu). Chỉ dùng trên thư mục ghi
# trong OWN_COLOR_ON của tools/build-folder-icons.py (important: chỉ vàng —
# trên đỏ thì chìm, trên default/teal/xám thì chói; nơi khác màu [2]).
#   important: từng là dark.danger #e26767, rồi #c25d5c (2026-10-05). Sậm hơn
#              2026-10-08 (user: giờ có thư mục đỏ) — L thấp hơn, độ sáng
#              chênh thân default 1,14:1, vàng 2:1; đọc được nhờ khác sắc.
#              Cùng ngày user thấy chói trên default/teal/xám → chỉ còn vàng.
[folder-symbols]
important = "#9e4443"

[window]
opacity = 0.90

# Màu chữ code trong Kate (theme editor "Samhie", chỉ bản tối) — bộ màu user tự
# làm cho VS Code (~/Storage/Design/Code/Custom/custom.css, 2026-10-13): mỗi
# loại chữ một dải gradient. Theme Kate chỉ có màu đơn → gen-theme.py lấy màu
# GIỮA hai đầu (trộn sRGB như CSS), màu nào sáng hơn chữ thường (dark.text) thì
# hạ độ sáng OKLab về bằng chữ thường (user: "đậm tối xuống 1 xíu để hợp với
# tone của màu text"); màu vốn tối hơn giữ nguyên. Lớp .mtkN của VS Code ứng
# với loại chữ nào: đo theo theme Minimal Dark của user (thứ tự màu trong
# tokenColors) — ghép sang kiểu chữ chung của Kate trong gen-theme.py.
[syntax]
# Màu chữ code. Một mục: một màu, tên nhóm khác (mượn màu), hoặc gradient
# VS Code của user [đầu, cuối] → lấy màu giữa. User 2026-10-20 ("nhiều màu nóng
# quá"): GIỮ gradient VS Code cho keyword / string / type / comment / cảnh báo
# + lỗi; ĐỔI sang tông mát cho function / attribute / number / operator (bộ cũ:
# function #fdcaa5→#ffcac9, attribute #13e2da→#b2ffda, number #b5cea8→#d6ff7f,
# operator #d7ba7d→#ffcac9).
keyword   = ["#e233ff", "#ff6b00"]  # .mtk6 .mtk19: keyword, storage, thẻ html
attribute = "#a8d8ea"               # xanh trời nhạt: biến, tên thuộc tính
string    = ["#d7ba7d", "#298292"]  # .mtk12: chuỗi
function  = "#7fb8ff"               # xanh lam: hàm, hàm có sẵn (print)
number    = "#e4a6d0"               # hồng phấn: số
operator  = "#9aa5b1"               # xám xanh, gần chữ thường: = + ( )
type      = ["#00aefd", "#298292"]  # .mtk18: kiểu, lớp
comment   = "#546e7a"               # .mtk5: một màu sẵn (user: giữ nguyên).
                                    # 3,32:1 trên card — dưới 4,5 có chủ ý: chú
                                    # thích mờ hẳn đi là màu user đã chọn.
information   = "string"    # code trong Markdown (trước: cam #c45b00 của Breeze)
warning       = "#da4453"   # cảnh báo / lỗi giữ màu Breeze Dark (user 2026-10-20)
                            # — 4,21:1 trên card, miễn kiểm có chủ ý (gen-theme.py
                            # SYNTAX_LOW_CONTRAST; gần nhất đạt 4,5 là #e14b59)
error         = "#da4453"
alert         = "#5ccfe6"   # TODO / FIXME, in đậm
region-marker = "function"  # #region / BEGIN…END

# Cặp ngoặc tô màu (plugin Colored Brackets của Kate, 5 màu xoay vòng). VS Code
# của user tô theo tầng lồng: tầng 0 và 3 = number, 1 = operator, 4 = attribute
# (.bracket-highlighting-N trong custom.css); tầng 2 không ghi đè → màu mặc
# định thứ ba của VS Code (editorBracketHighlight.foreground3).
bracket-default = "#179fff"
brackets  = ["number", "operator", "bracket-default", "number", "attribute"]

# 16 màu ANSI của Konsole (bản 1.0, theme/konsole/Samhie.colorscheme).
# Thứ tự: đen, đỏ, lục, vàng, lam, tím, cyan, trắng — thường / sáng (intense).
# Sinh ra /usr/share/konsole/Samhie.colorscheme. Dấu nhắc lệnh ($) dùng màu số
# 6 (cyan) — files/system/etc/profile.d/samhie-prompt.sh.
[terminal]
background = "#171717"     # = dark.card: vùng dấu nhắc là Card (user chốt)
background-intense = "#262626"
foreground = "#bdbec1"     # = dark.text — user đổi 2026-10-03 (cũ #e4e4e4)
foreground-faint = "#989898"
foreground-intense = "#f8f8f8"
cursor = "#00c0e8"         # con trỏ khối nhấp nháy, màu nhấn
normal = ["#3b3c3c", "#e05e5e", "#7acc8c", "#e2b262", "#60a0dc", "#b28cd6", "#00c0e8", "#d0d0d0"]
bright = ["#5a5a5a", "#f07c7c", "#96dca5", "#f0c882", "#82b9eb", "#c8a8e6", "#52d6fa", "#f6f6f6"]
# Chữ "mờ" (escape 2, vd gợi ý lệnh mờ của shell) — bản 1.0 tự chọn ~2/3 độ sáng.
faint  = ["#2d2d2d", "#964040", "#528a5f", "#987842", "#406c94", "#785e90", "#00829d", "#8c8c8c"]

# Lời hứa tương phản — gen-theme.py đo lại mỗi lần chạy, hụt là BÁO LỖI.
# Chuẩn WCAG: 4,5:1 cho chữ thường, 3:1 cho thành phần giao diện (viền, icon).
# Cặp nào cố ý thấp hơn thì ghi lý do ngay dưới.
[[contrast]]
fg = ["text", "text-muted", "accent-text", "danger", "warning", "success", "link"]
bg = ["card", "secondary"]
min = 4.5

[[contrast]]
fg = ["text"]
bg = ["sub-secondary"]
min = 4.5

[[contrast]]
fg = ["on-selection"]
bg = ["selection", "selection-alt"]
min = 4.5

[[contrast]]
# Chữ phụ trong vùng chọn (vd cột ngày sửa của file đang chọn).
fg = ["on-selection-muted"]
bg = ["selection"]
min = 4.5

[[contrast]]
fg = ["bar-text"]
bg = ["bar"]
min = 4.5

[[contrast]]
fg = ["bar-accent"]
bg = ["bar"]
min = 3.0

[[contrast]]
fg = ["on-accent"]
bg = ["accent"]
min = 4.5

[[contrast]]
