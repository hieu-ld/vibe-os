---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Phần CHUNG của mọi bản Samhie. samhie.yml và samhie-nvidia.yml chỉ khác nhau
# ở image nền; mọi thứ còn lại nằm ở đây để hai bản không bao giờ lệch nhau.
#
# NGUYÊN TẮC CHỌN NGUỒN GÓI — đọc trước khi thêm gói mới:
#   1. Ưu tiên kho CHÍNH THỨC của Fedora. Gói ở đây được đội bảo mật Fedora vá.
#   2. Chỉ Hyprland và họ hàng của nó lấy từ COPR, vì Fedora không có. COPR là
#      kho cá nhân — nên chỉ bật đúng một COPR, đúng cái wiki Hyprland khuyên
#      dùng, và tắt nó trong image ngay sau khi cài (cleanup: file .repo vẫn
#      còn nhưng enabled=0, không gói nào tải từ đó được nữa).
#   3. App thường dùng (trình duyệt, xem ảnh, đọc PDF) cài bằng Flatpak để chạy
#      trong sandbox.

modules:
  # ── 1. Gói từ kho chính thức Fedora ────────────────────────────────────────
  # Cài TRƯỚC module COPR. Như vậy quickshell, qt6ct… chắc chắn là bản Fedora;
  # sang module sau, dnf thấy chúng đã có nên không kéo bản COPR đè lên.
  - type: dnf
    install:
      packages:
        # Giao diện tự vẽ (thanh trên, dock, popup, màn hình khoá — giai đoạn 3)
        - quickshell
        # Thông báo (quickshell/notifications) và lịch sử clipboard Win+V
        # (quickshell/clipboard + cliphist) đều là Quickshell — mako, fuzzel đã gỡ.
        - swaybg                  # hình nền
        - libnotify               # notify-send (script chụp màn hình, màn khoá)
        - gammastep               # Night light của quick settings (477 KiB, không kéo gói nào)

        # Màn hình đăng nhập, chạy trên Wayland (không cần X server). Compositor
        # cho greeter là KWin (sddm-wayland-plasma, như Fedora KDE), KHÔNG phải
        # Weston (sddm-wayland-generic): Weston 15 chỉ bật chuột ở sự kiện chuột
        # đầu tiên, lúc greeter đã mở, rồi gửi wl_pointer.enter với serial 0 —
        # Qt bỏ qua serial 0 nên không bao giờ đặt con trỏ (đo 2026-10-01, xem
        # PLAN). Thêm ~43 MiB (kwin, kscreenlocker, plasma-keyboard…), toàn kho
        # Fedora. KWin chỉ chạy cho màn hình đăng nhập; phiên làm việc vẫn Hyprland.
        - sddm
        - sddm-wayland-plasma

        # Ứng dụng Qt/KDE: quản lý file, terminal, giải nén, soạn thảo
        - dolphin
        - kio-extras              # thumbnail, giao thức mạng cho Dolphin
        - ffmpegthumbs            # thumbnail video
        - kdegraphics-thumbnailers
        - kde-cli-tools           # kioclient: để menu "Open with" chạy ngoài Plasma
        - konsole
        - ark
        - kwrite                  # mở nhanh file chữ; VS Code cho việc code
        # Kate: đang thử thay VS Code (2026-10-10). Đo trong image: +33 MB
        # (kate + kate-plugins + 3 thư viện KF6; kate-libs đã có nhờ kwrite) —
        # VS Code chiếm 1,06 GB. Đo RAM máy ảo, cùng dự án: Kate 108 MB, VS Code
        # 873 MB. kate-plugins ghi rõ vì nó chỉ là weak dep mà cây dự án,
        # terminal nhúng, Git, LSP đều nằm trong đó.
        - kate
        - kate-plugins

        # Giao diện ứng dụng Qt: Kvantum vẽ widget bằng SVG (giai đoạn 4).
        # plasma-integration cài ở khối riêng ngay dưới (không kéo weak deps).
        - kvantum
        - plasma-breeze           # style Breeze làm nền dự phòng
        - breeze-icon-theme       # bộ icon Samhie kế thừa breeze-dark

        # Hệ thống: xin quyền admin, lưu mật khẩu, hộp thoại chọn file
        - polkit-kde
        - gnome-keyring
        # Module PAM mở khoá keyring bằng mật khẩu đăng nhập. Fedora tách nó ra
        # gói riêng; thiếu nó thì /etc/pam.d/sddm lặng lẽ bỏ qua (dòng `-auth`)
        # và app đầu tiên cần lưu mật khẩu sẽ bắt tạo keyring mới — gặp với
        # Edge trong máy ảo 2026-09-27.
        - gnome-keyring-pam
        - xdg-desktop-portal-gtk

        # Gõ tiếng Việt
        - fcitx5
        - fcitx5-unikey
        - fcitx5-qt
        - fcitx5-gtk
        - fcitx5-configtool

        # Tiện ích: clipboard, chụp màn hình, âm lượng, độ sáng, mạng.
        # Chọn vùng chụp là giao diện Quickshell (usr/share/samhie/quickshell),
        # không gọi slurp nữa — slurp vẫn có trong image vì
        # xdg-desktop-portal-hyprland cần nó (chọn vùng khi chia sẻ màn hình).
        # Tiếng tách dùng pw-play có sẵn trong image nền.
        - cliphist
        - grim
        - swappy
        - playerctl
        - brightnessctl
        - pavucontrol
        - NetworkManager-tui

        # Font: Noto Sans (bản variable, mọi độ đậm) có sẵn trong image nền —
        # google-noto-sans-fonts là bản tĩnh thứ hai, 43 MB (gỡ 2026-10-05).
        # Font mono là Hack (đi kèm plasma-integration); Dongle nằm trong repo.

        # Bảo mật
        - firewalld
      # Gói "gợi ý cài kèm" (weak deps) không ai dùng — chặn hẳn (đo 2026-10-05
      # bằng dnf5 repoquery --whatrequires/--whatrecommends trong image):
      #   cpp     43 MB — xrdb gợi ý (sddm → xorg-x11-xinit → xrdb), chỉ để
      #           xrdb chạy bộ tiền xử lý C; SDDM của Samhie chạy Wayland.
      #   catdoc  0,6 MB + tk 3,8 MB — kfilemetadata gợi ý, trích chữ file .doc.
      #   kate-krunner-plugin — kate gợi ý; Samhie không chạy KRunner.
      exclude:
        - cpp
        - catdoc
        - kate-krunner-plugin

  # Platform theme "kde" cho app Qt ngoài Plasma: Dolphin/Konsole đọc màu, icon,
  # font, widget style từ kdeglobals — gồm cả /etc/xdg/kdeglobals của image —
  # y như trong Plasma. Thay qt6ct (chỉ đọc ~/.config, bảng màu định dạng riêng;
  # đo 2026-09-28, xem PLAN). Weak deps kéo ~40 gói Plasma (kglobalacceld,
  # kactivitymanagerd, aurorae…); tắt thì còn 6 gói / 35 MB, gồm con trỏ Breeze.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - plasma-integration

  # ── 2. Hyprland từ COPR ────────────────────────────────────────────────────
  # lionheartp/Hyprland là COPR mà wiki chính thức của Hyprland chỉ tới cho
  # Fedora (kiểm lại 2026-09-27). COPR này còn chứa kitty, qt6ct, quickshell,
  # matugen… bản riêng — `exclude` để chắc chắn KHÔNG gói nào trong số đó lọt vào.
  - type: dnf
    repos:
      cleanup: true
      copr:
        - lionheartp/Hyprland
    install:
      packages:
        - hyprland
        - hyprland-guiutils       # hộp thoại của Hyprland (app treo, cảnh báo)
        - xdg-desktop-portal-hyprland  # chia sẻ màn hình, chụp màn hình
        - hypridle                # tự khoá khi rời máy (màn hình khoá là Quickshell)
      exclude:
        - kitty
        - qt6ct
        - quickshell
        - matugen
        - cliphist
        - nwg-look
        - wlroots
        # Thanh panel GTK, COPR khai "Supplements: hyprland" nên tự vào cùng
        # Hyprland (+5 gói python/gtk, ~5 MB). Samhie dùng Quickshell.
        - nwg-panel

  # ── 3. VS Code từ kho của Microsoft ────────────────────────────────────────
  # File .repo tự viết (files/dnf/vscode.repo) thay vì dùng file của Microsoft,
  # vì file gốc để gpgcheck=0 — tức không kiểm chữ ký gói.
  - type: dnf
    repos:
      cleanup: true
      files:
        - vscode.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
    install:
      packages:
        - code

  # ── 4. File cấu hình của Samhie ────────────────────────────────────────────
  # files/system soi gương đường dẫn thật: files/system/etc/xdg/hypr/hypridle.conf
  # sẽ nằm ở /etc/xdg/hypr/hypridle.conf trong image.
  - type: files
    files:
      - source: system
        destination: /

  - type: os-release
    properties:
      NAME: Samhie
      PRETTY_NAME: Samhie
      # Icon chữ S (files/system/usr/share/icons/hicolor/scalable/apps/samhie.svg)
      # — màn hình "About", fastfetch… đọc khoá này. ID vẫn là fedora: đổi ID
      # làm hỏng việc nhận diện kho COPR (README module os-release).
      LOGO: samhie
      HOME_URL: https://github.com/hieu-ld/samhie
      BUG_REPORT_URL: https://github.com/hieu-ld/samhie/issues

  # ── 5. Dịch vụ hệ thống ────────────────────────────────────────────────────
  - type: systemd
    system:
      enabled:
        - sddm.service
        - firewalld.service
    user:
      enabled:
        # Lần đăng nhập đầu của mỗi tài khoản: thư mục Storage + sidebar
        # Dolphin (files/system/usr/libexec/samhie/user-setup).
        - samhie-user-setup.service
      masked:
        # Autostart của gói nvidia-settings (chỉ có ở bản NVIDIA): nạp cấu hình
        # cho X11, vô dụng dưới Hyprland. Lệnh `[ -e /dev/nvidia0 ] && …` của
        # nó trả mã lỗi khi không có card → uwsm (fumon) báo "Failed unit"
        # mỗi lần đăng nhập. Mask thay vì sửa file của gói.
        # Hai dấu `\\`: module chạy `printf "$unit"`, một dấu `\` sẽ bị dịch
        # `\x2d` → `-` thành tên unit sai.
        - 'app-nvidia\\x2dsettings\\x2dload@autostart.service'

  # Mã nguồn widget style "samhie" (style/, C++) cho script samhie-style.sh
  # bên dưới. Build NGAY TRONG image, sau mọi module dnf: plugin Qt chỉ nạp
  # được khi Qt lúc build không mới hơn Qt lúc chạy — build ở stage riêng thì
  # dnf có thể kéo Qt mới hơn image (Fedora lên Qt 6.x giữa chu kỳ).
  - type: containerfile
    snippets:
      - COPY style /tmp/samhie-style
      # Plugin Kate "samhieterminal" (kate/) cho script kate-terminal.sh — cùng lý do
      - COPY kate /tmp/samhie-kate

  - type: script
    snippets:
      - systemctl set-default graphical.target
      # Cache icon hicolor do gói cài tạo ra TRƯỚC khi có icon samhie; cache cũ
      # hơn thư mục là app GTK có thể không thấy icon mới.
      - gtk-update-icon-cache -f /usr/share/icons/hicolor
    scripts:
      - firewall.sh
      - plymouth.sh
      - cursors.sh
      - dolphin-ui.sh
      - konsole-ui.sh
      - kate-ui.sh
      - samhie-style.sh
      - kate-terminal.sh

  # ── 6. App Flatpak (cài ở lần khởi động đầu tiên) ──────────────────────────
  # Edge cài bằng Flatpak chứ không đưa bản RPM vào image: image là công khai,
  # nhét Edge vào là phân phối lại phần mềm đóng của Microsoft. Bản Flatpak tải
  # file cài thẳng từ Microsoft về máy người dùng nên không vướng chuyện đó.
  - type: default-flatpaks
    configurations:
      # Không báo: dịch vụ của module chạy MỖI lần khởi động (timer OnBootSec=30,
      # đọc /usr/libexec/bluebuild/default-flatpaks/system-flatpak-setup), nên
      # notify: true là hai thông báo "Starting/Finished…" mỗi lần bật máy —
      # user thấy trong máy ảo 2026-09-28. App đã cài thì lần sau bỏ qua.
      - notify: false
        scope: system
        install:
          - com.microsoft.Edge
          - com.github.tchx84.Flatseal   # xem và thu hồi quyền của app Flatpak
          - org.kde.gwenview             # xem ảnh
          - org.kde.okular               # đọc PDF

  # Dựng lại initramfs để theme Plymouth (plymouth.sh ở trên) có mặt lúc khởi
  # động — màn hình boot hiện TRƯỚC khi ổ đĩa thật được mount, nên nó chỉ thấy
  # những gì nằm trong initramfs. Chạy dracut của image với cấu hình dracut của
  # image nền (không tải gì). Phải đứng SAU mọi module đụng tới boot.
  - type: initramfs

  # Ký số image. Máy cài Samhie kiểm chữ ký trước khi nhận bản cập nhật, nên
  # không ai đánh tráo được image giữa đường.
  - type: signing
