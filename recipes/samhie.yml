---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Bản cho máy dùng card AMD hoặc Intel. Máy có card NVIDIA dùng samhie-nvidia.yml.
# Image được đẩy lên ghcr.io/hieu-ld/samhie
name: samhie
description: Samhie — Fedora Atomic with Hyprland and a hand-drawn Quickshell desktop.

# base-main = Fedora Atomic chưa có desktop nào, Universal Blue thêm sẵn codec,
# ujust, dịch vụ tự cập nhật. Ghim số phiên bản Fedora (không dùng `latest`)
# để lên Fedora mới là việc mình CHỦ ĐỘNG làm, không tự nhảy lúc nửa đêm.
base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  - from-file: common.yml
