; Cảnh báo của qmlls (máy chủ ngôn ngữ QML trong Kate) và qmllint cho QML của
; Samhie. qmlls tìm file này từ thư mục của file QML đi ngược lên.
;
; Tắt những loại mà ở QML của Samhie TOÀN là báo nhầm (đo 2026-10-12: 481 cảnh
; báo trên files/system/usr/share/samhie/quickshell, chỉ 1 cái là chuyện thật):
;   - MissingProperty, ImportFailure: singleton Theme/Windows (`pragma
;     Singleton`) không khai trong qmldir — Quickshell tự sinh qmldir lúc chạy,
;     qmlls không thấy → "Member "c" not found on type "Theme"" mọi chỗ.
;   - UnqualifiedAccess: `root.…` trong delegate — QML hợp lệ, qmllint khắt khe.
;   - UncreatableType, UnresolvedType, BadSignalHandlerParameters: PanelWindow,
;     FileViewAdapter, QProcess::ExitStatus khai kiểu theo lối riêng của Quickshell.
; Còn lại 2 cảnh báo (cố ý giữ): `property rect clip` trong screenshot-region.qml
; trùng tên Item.clip (chạy đúng, nhưng nên đổi tên); `Binding { target: Theme }`
; (báo nhầm vì singleton — giữ IncompatibleType vì nó bắt lỗi kiểu thật).
; Cái giá: gõ sai tên thuộc tính (`colr:`) hay tên biến không còn bị gạch —
; Quickshell vẫn báo lúc chạy. Lỗi cú pháp vẫn báo (domParsing, đo trong Kate).
; Chỉ áp cho file trong repo này; cấu hình QML riêng của người dùng
; (~/.config/quickshell) không bị ảnh hưởng.
[Warnings]
MissingProperty=disable
ImportFailure=disable
UnqualifiedAccess=disable
UncreatableType=disable
UnresolvedType=disable
BadSignalHandlerParameters=disable
