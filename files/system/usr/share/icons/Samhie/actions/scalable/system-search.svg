<!-- Logo dock Samhie — từng là MỘT HỌ BỐN CÁI, giờ chỉ còn file này:
     preferences-system đổi sang bản user vẽ (2026-09-23), cặp user-trash đổi
     sang nét Tabler (2026-09-24). Ghi chú gốc bên dưới giữ lại cho biết vì sao.
     Khối <defs> dưới đây từng PHẢI giống hệt nhau ở cả bốn file: b = thân đá xám,
     a = xanh ngọc Samhie (#00C0E8 của SamhieDark), p = trắng ngà cho núm và giấy.
     Thân là xám TRUNG TÍNH chứ không tối: dock nền #0A0A0A, thân tối tan vào
     nền. Đã nâng sáng một nấc 2026-09-10 vì user báo đáy thùng rác còn lẫn với
     dock — đáy giờ #52616D (sáng ~93) so với Konsole 74.
     Hình vẽ phải LẤP khung 24x24 khoảng 82-87%; vẽ nhỏ hơn thì icon trông bé
     hơn hàng xóm dù cùng cỡ pixel. Xem docs/icons-wanted.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7E8E99"/><stop offset="1" stop-color="#52616D"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FD9F5"/><stop offset="1" stop-color="#0097BE"/></linearGradient><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F8F7"/><stop offset="1" stop-color="#BFD2CF"/></linearGradient></defs>
<path d="M15.4 15.4 L20 20" stroke="url(#a)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
<circle cx="10.5" cy="10.5" r="4.6" fill="url(#b)"/>
<circle cx="10.5" cy="10.5" r="6.1" stroke="url(#a)" stroke-width="3" fill="none"/>
