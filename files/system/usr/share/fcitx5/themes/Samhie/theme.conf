# SINH TỰ ĐỘNG từ theme/palette.toml bởi tools/gen-theme.py — đừng sửa tay.
# Theme fcitx5 của Samhie (bản tối). /etc/xdg/fcitx5/conf/classicui.conf chọn nó.
[Metadata]
Name=Samhie
Version=1
Author=Samhie
Description=Samhie dark theme
ScaleWithDPI=True

[InputPanel]
NormalColor=#bdbec1
HighlightCandidateColor=#f6f6f6
HighlightColor=#f6f6f6
HighlightBackgroundColor=#006a80
FullWidthHighlight=True
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=10
Right=10
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Image=panel.svg
Color=#171717
BorderColor=#3b3c3c
BorderWidth=1

[InputPanel/Background/Margin]
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/Highlight]
Image=highlight.svg
Color=#006a80

[InputPanel/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
NormalColor=#bdbec1
HighlightCandidateColor=#f6f6f6

[Menu/Background]
Image=panel.svg
Color=#171717
BorderColor=#3b3c3c
BorderWidth=1

[Menu/Background/Margin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Highlight]
Image=highlight.svg
Color=#006a80

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=#3b3c3c

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
