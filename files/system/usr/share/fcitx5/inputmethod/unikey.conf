# Mục kiểu gõ Unikey — bản ĐÈ của Samhie lên file của gói fcitx5-unikey, chỉ
# để thêm MỘT khoá: Label=vn.
#
# Label là nhãn gọn fcitx5 dùng ở hai chỗ: ô báo kiểu gõ khi Ctrl+Space (tiếng
# Anh ra "en" — Label của bàn phím), và chữ trên khay khi bật PreferTextIcon
# (giai đoạn 3, thanh Quickshell). Gói không khai Label nên ô ra tên đầy đủ
# "Unikey (Telex)". Phần "(Telex)" bỏ bằng file dịch
# /usr/share/locale/en/LC_MESSAGES/fcitx5.mo (sinh bởi tools/gen-theme.py).
#
# Vì sao "vn" chứ không "vi" (bản 1.0 đo 2026-09-10, ~/Projects/Distro,
# system/usr/local/share/fcitx5/inputmethod/unikey.conf): fcitx5 căn giữa
# KHUNG MỰC của nhãn; chấm chữ "i" làm "vi" cao hơn "en" nên tụt lệch 2px.
# "vn" trùng khít "en" từng pixel.
#
# Vì sao đè thẳng file của gói: bản 1.0 đặt ở /usr/local/share, nhưng trên
# Fedora Atomic /usr/local là symlink sang /var/usrlocal — image không đặt file
# vào đó được. Đè ở đây an toàn vì image build lại từ gói mỗi lần, module
# `files` chạy SAU các module `dnf` (recipes/common.yml). Khi nâng Fedora: so
# lại với file của gói (bản này chép từ fcitx5-unikey 5.1.12, bỏ Name[xx]).

[InputMethod]
Name=Unikey
Icon=fcitx-unikey
LangCode=vi
Addon=unikey
Configurable=True
Label=vn
