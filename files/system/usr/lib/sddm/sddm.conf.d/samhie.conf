# Mặc định SDDM của Samhie. Nằm ở /usr/lib (chỗ của nhà phân phối); muốn đổi
# thì ghi file vào /etc/sddm.conf.d/ — SDDM đọc /usr/lib trước, /etc đè sau.
# Fedora vẫn chạy SDDM trên Weston (DisplayServer=wayland,
# CompositorCommand=weston --shell=kiosk — mặc định biên dịch sẵn của Fedora).

[Theme]
# Theme ở /usr/share/sddm/themes/samhie. Mặc định của Fedora là
# 01-breeze-fedora, không cài (kéo theo Plasma) → trước đây ra theme dự phòng.
Current=samhie
# SDDM đặt XCURSOR_THEME/SIZE cho cả greeter lẫn Weston (Greeter.cpp).
# Cùng bộ và cỡ với Hyprland (samhie.lua).
CursorTheme=Samhie-cursors
CursorSize=24

[Wayland]
# Thư mục ĐỨNG TRƯỚC thắng khi hai thư mục có file cùng tên (SessionModel
# gộp theo tên file, Session::setTo lấy thư mục đầu tiên có file — SDDM
# 0.21). /usr/share/samhie/wayland-sessions chỉ có hyprland.desktop với
# Hidden=true → ẩn phiên "Hyprland" thường, còn "Hyprland (uwsm-managed)".
# Hai thư mục sau là mặc định của SDDM.
SessionDir=/usr/share/samhie/wayland-sessions,/usr/local/share/wayland-sessions,/usr/share/wayland-sessions
