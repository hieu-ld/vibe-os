name: build

on:
  schedule:
    # 06:00 UTC mỗi ngày (13:00 giờ Việt Nam) — sau khi Universal Blue build
    # xong image nền, để bản vá bảo mật mới nhất của Fedora vào Samhie trong ngày.
    - cron: "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:   # cho phép bấm tay "Run workflow" trên GitHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false   # bản NVIDIA lỗi thì bản thường vẫn build tiếp, và ngược lại
      matrix:
        recipe:
          - samhie.yml
          - samhie-nvidia.yml
    steps:
      - name: Build image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
