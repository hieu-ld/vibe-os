<!-- Logo Konsole của Samhie — user VẼ trong Figma, node 379:569 (2026-09-23).
     Chữ "~$" (Inter Semi Bold 8px, cyan #00C0E8) Figma đã đổi thành nét —
     không phụ thuộc font. Hình 28x24 đặt giữa khung vuông 28x28.

     "KÍNH": user thêm hiệu ứng Glass của Figma (ánh sáng -35°, 80%). Không
     chép thẳng được — kính của Figma làm mờ thứ NẰM SAU hình, icon thì không
     nhìn thấy gì sau nó. Cái làm nên chất kính trong bản Figma là VIỀN BẮT
     SÁNG quanh ô, vẽ lại bằng nét gradient lùi vào mép trong (giải thích đủ ở
     org.kde.dolphin.svg). Với Konsole đây là thứ QUAN TRỌNG NHẤT: thân ô gần
     đen, dock giờ cũng gần đen và không còn ô nền, thiếu viền thì chỉ còn chữ
     "~$" lơ lửng.
     Thân ô sáng hơn bản Figma một chút (đục 0.2 → 0.35) vì cùng lý do.
     Bỏ bóng đổ: bóng đen trên nền đen không thấy, và bị cắt ở khung 32px.
     Tên file = Icon=utilities-terminal của org.kde.konsole.desktop. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28" fill="none">
  <defs>
    <linearGradient id="box" x1="22" y1="4" x2="22" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D4D4D"/>
      <stop offset="1" stop-color="#515151"/>
    </linearGradient>
    <!-- ánh sáng -35°: từ trên-trái xuống dưới-phải -->
    <linearGradient id="rim" x1="8" y1="4" x2="36" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <g transform="translate(-8 -2)">
    <!-- Lớp LÓT ĐẶC #0a0a0a (= nền dock) dưới thân kính (thêm 2026-09-24). Thân
         vẫn trong như user vẽ, nhưng giờ chồng lên một nền đặc: trên dock trông
         gần như cũ, còn trong Overview — nơi icon đè lên ảnh thu nhỏ cửa sổ — thì
         không còn lộ nội dung phía sau (user chụp ở phiên live, muốn "đặc 100%"). -->
    <rect x="8" y="4" width="28" height="24" rx="4" fill="#0a0a0a"/>
    <rect x="8" y="4" width="28" height="24" rx="4" fill="url(#box)" fill-opacity="0.35"/>
    <rect x="8.5" y="4.5" width="27" height="23" rx="3.5" stroke="url(#rim)" stroke-width="1"/>
    <rect x="9.5" y="5.5" width="25" height="21" rx="2.5" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
