# Màn hình khoá của Samhie (bản mặc định, TẠM).
#
# Giai đoạn 3 sẽ vẽ lại màn hình khoá bằng Quickshell. Tới lúc đó hyprlock là
# lưới an toàn: đơn giản, chạy chắc, đọc mật khẩu qua PAM như SDDM.
#
# Muốn chỉnh riêng: chép file này về ~/.config/hypr/hyprlock.conf rồi sửa —
# hyprlock tìm ở đó TRƯỚC, không thấy mới đọc /etc/xdg/hypr/hyprlock.conf.
#
# Màu sinh từ theme/palette.toml (nguồn màu duy nhất). File dưới định nghĩa
# $bar, $card, $text... dạng hex không có '#'. Chép file này về ~/.config vẫn
# giữ dòng `source` thì màu vẫn ăn theo mỗi lần Samhie cập nhật bảng màu.
source = /usr/share/samhie/hypr/hyprlock-colors.conf

$font = Noto Sans

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Ảnh chụp màn hình làm mờ thật đậm: thấy được "đang ở đâu" mà không đọc được chữ.
background {
    monitor =
    path = screenshot
    color = rgb($bar)
    blur_passes = 4
    blur_size = 8
    brightness = 0.5
}

# GIỜ
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgb($text)

    position = 0, 160
    halign = center
    valign = center
}

# NGÀY — tiếng Việt kiểu "Thứ 6, 25 tháng 9", đúng như đồng hồ của Samhie 1.0.
# Không dùng `date +%A` vì nó theo locale máy (en_US) và ra "Friday".
label {
    monitor =
    text = cmd[update:60000] /usr/libexec/samhie/lock-date
    font_size = 20
    font_family = $font
    color = rgb($text_muted)

    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    rounding = 12

    inner_color = rgb($card)
    outer_color = rgb($sub_secondary)
    check_color = rgb($accent)
    fail_color = rgb($danger)
    font_color = rgb($text)

    font_family = $font
    placeholder_text = <span foreground="##$text_muted">Mật khẩu</span>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}
