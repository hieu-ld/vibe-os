# Tự khoá của Samhie (bản mặc định).
# Thời gian khoá: Settings → Appearance → "Lock screen after" (không cần sửa
# file). Muốn chỉnh sâu hơn thì chép file này về ~/.config/hypr/hypridle.conf
# rồi sửa; Samhie tự dùng bản của bạn nếu có (khi đó ô trong Settings khoá lại).
#
# Hai dòng "# samhie:" đánh dấu listener mà /usr/libexec/samhie/idle đổi số
# giây theo lựa chọn trong Settings (tắt màn = khoá + 30 s; Never = bỏ cả hai).

general {
    # `loginctl lock-session` (phím Win+L) phát sự kiện khoá → chạy màn hình
    # khoá Quickshell. Script tự bỏ qua nếu đang khoá rồi.
    lock_cmd = /usr/libexec/samhie/lock
    # Khoá TRƯỚC khi máy ngủ, để lúc thức dậy không lộ desktop dù chỉ một khung hình.
    before_sleep_cmd = loginctl lock-session
    # 3 = giữ máy chưa ngủ cho tới khi Hyprland báo màn hình ĐÃ khoá. Mặc định
    # (2) chỉ tự chọn 3 khi thấy chữ "hyprlock" trong lệnh — wiki hypridle.
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 5 phút không dùng: khoá máy.
# samhie:lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5 phút rưỡi: tắt màn hình.
# samhie:display-off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
